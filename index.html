    <body> 
        <main>
            <section id="container">
                <section id="art">
                     <section id="kandinsky">
                    <div id="xlg-1"></div>
                    <div id="xlg-2"></div>
                    <div id="xlg-3"></div>

                    <div id="lg-1" class="large burn"></div>
                    <div id="lg-2" class="large burn"></div>
                    <div id="lg-3" class="large burn"></div>
                    <div id="lg-4" class="large burn"></div>
                    <div id="lg-5" class="large burn"></div>
                    <div id="lg-6" class="large burn"></div>
                    <div id="md-1" class="medium burn"></div>
                    <div id="md-2" class="medium burn"></div>
                    <div id="md-3" class="medium burn"></div>
                    <div id="md-4" class="medium burn"></div>
                    <div id="sm-1" class="small burn"></div>
                    <div id="sm-2" class="small burn"></div>
                    <div id="sm-3" class="small burn"></div>
                    <div id="sm-4" class="small burn"></div>
                    <div id="sm-5" class="small burn"></div>
                    <div id="sm-6" class="small burn"></div>
                    <div id="xsm-1" class="xsmall burn"></div>
                    <div id="xsm-2" class="xsmall burn"></div>
                    </section>
                    <section id="mondrian">
                    <section id="upper-half">
                        <section id="area-a">
                            <div id="a-1"></div>
                            <div id="a-2"></div>
                            <div id="a-3"></div>
                        </section>

                        <section id="area-b">
                            <div id="b-1"></div>
                            <div id="b-2"></div>
                        </section>

                        <section id="area-c">
                            <section id="c-1">
                                <div id="c-1-red"></div>
                                <section id="c-1-2">
                                    <div id="c-1-2-black"></div>
                                    <div id="c-1-2-white"></div>
                                </section>
                            </section>

                            <section id="c-2">
                                <div id="c-2-yellow"></div>
                                <div id="c-2-white-l"></div>
                                <div id="c-2-white-r"></div>
                                <div id="c-2-white"></div>
                            </section>

                        </section>

                    </section>

                    <section id="lower-half">
                        <div id="area-d"></div>
                        <section id="area-e">
                            <div id="e-black"></div>
                            <div id="e-white"></div>
                        </section>
                        <section id="area-f">
                            <div id="f-white-sm"></div>
                            <div id="f-black"></div>
                            <div id="f-blue"></div>
                            <div id="f-white-lg"></div>
                        </section>

                    </section>

                    <section id="right-strip">
                        <div id="right-white"></div>
                        <div id="right-red"></div>
                    </section>
                    </section>
                </section>
            
                <button id="reset">reset
                </button>
            </section>
            <button id="about">
                <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">

                </svg>
            </button>
        </main>
